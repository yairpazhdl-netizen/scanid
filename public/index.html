<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b0245e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Escáner de INE</title>
<style>
:root{--bg:#f1f4f6;--ink:#14212b;--mute:#5d6b76;--line:#d5dde3;--card:#fff;--acc:#b0245e;--acc-ink:#fff;--err:#b3261e;--ok:#1b6e43}
@media (prefers-color-scheme:dark){:root{--bg:#10171c;--ink:#e8eef2;--mute:#9aa8b2;--line:#27343d;--card:#18222a;--acc:#e0568c;--acc-ink:#1a0610;--err:#ff8a80;--ok:#6fd3a0}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:20px 0 8px}
p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink);width:100%}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--mute);width:auto;padding:6px 8px;font-weight:500}
button:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#msg{min-height:1.4em;margin:12px 0 0;font-size:.95rem}
#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
.item{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item:first-child{border-top:0}
.item b{display:block}.item small{color:var(--mute)}
.empty{color:var(--mute);padding:8px 0}
.hidden{display:none!important}
#preview{width:100%;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<main>
  <section id="auth" class="hidden">
    <h1>Escáner de INE</h1>
    <p class="sub">Inicia sesión para registrar credenciales.</p>
    <div class="card">
      <label for="email">Correo</label><input id="email" type="email" autocomplete="email">
      <label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password">
      <div class="row" style="margin-top:16px">
        <button id="btnLogin">Entrar</button>
        <button id="btnSignup" class="sec">Crear cuenta</button>
      </div>
    </div>
  </section>

  <section id="home" class="hidden">
    <div class="top"><h1>Credenciales</h1><button id="btnOut" class="link">Salir</button></div>
    <p class="sub">Fotografía el frente de la INE para registrar a la persona.</p>
    <button id="btnScan">Escanear INE</button>
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    <h2>Registros</h2>
    <input id="search" type="search" placeholder="Buscar por nombre, CURP o municipio" aria-label="Buscar">
    <div class="card" style="margin-top:10px"><div id="list"><div class="empty">Aún no hay registros. Escanea la primera INE.</div></div></div>
  </section>

  <section id="review" class="hidden">
    <div class="top"><h1>Revisa los datos</h1><button id="btnBack" class="link">Cancelar</button></div>
    <p class="sub">Corrige lo que no coincida con la credencial.</p>
    <img id="preview" alt="Foto de la credencial">
    <div class="card" style="margin-top:12px">
      <div class="grid2">
        <div><label for="f_nombre">Nombre(s)</label><input id="f_nombre"></div>
        <div><label for="f_apellido_paterno">Apellido paterno</label><input id="f_apellido_paterno"></div>
        <div><label for="f_apellido_materno">Apellido materno</label><input id="f_apellido_materno"></div>
        <div><label for="f_fecha_nacimiento">Fecha de nacimiento</label><input id="f_fecha_nacimiento" type="date"></div>
        <div><label for="f_sexo">Sexo</label><select id="f_sexo"><option value=""></option><option>H</option><option>M</option></select></div>
        <div><label for="f_seccion">Sección</label><input id="f_seccion" inputmode="numeric"></div>
      </div>
      <label for="f_curp">CURP</label><input id="f_curp" autocapitalize="characters">
      <label for="f_clave_elector">Clave de elector</label><input id="f_clave_elector" autocapitalize="characters">
      <label for="f_domicilio">Domicilio</label><input id="f_domicilio">
      <div class="grid2">
        <div><label for="f_colonia">Colonia</label><input id="f_colonia"></div>
        <div><label for="f_cp">Código postal</label><input id="f_cp" inputmode="numeric"></div>
        <div><label for="f_municipio">Municipio</label><input id="f_municipio"></div>
        <div><label for="f_estado">Estado</label><input id="f_estado"></div>
        <div><label for="f_vigencia">Vigencia</label><input id="f_vigencia"></div>
        <div><label for="f_anio_registro">Año de registro</label><input id="f_anio_registro"></div>
      </div>
      <div style="margin-top:16px"><button id="btnSave">Guardar registro</button></div>
    </div>
  </section>

  <p id="msg" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script type="module" src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</body>
</html>
